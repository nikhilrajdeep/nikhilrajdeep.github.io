name: Monthly publication refresh

on:
  schedule:
    - cron: '23 10 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publications-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.2
      - run: python scripts/test_refresh_scholar.py
      - name: Fetch verified Google Scholar snapshot
        run: python scripts/refresh-scholar.py
      - name: Render and validate publications
        run: |
          node scripts/build-publications.cjs
          node --check js/publications.js
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: scholar-records-for-review
          path: scholar-review.json
      - name: Publish updated snapshot and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- data/publications.json index.html; then
            git config user.name 'Nikhil Raj Deep'
            git config user.email 'nikhilrajdeep@gmail.com'
            git add data/publications.json index.html
            git commit -m 'Refresh monthly Google Scholar publication metrics'
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          fi
